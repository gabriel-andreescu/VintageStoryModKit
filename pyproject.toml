[project]
name = "vintagestorymodkit-dev"
version = "0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "copier>=9.0,<10",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.7",
    "pytest>=9,<10",
    "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
extend-select = ["I"]
