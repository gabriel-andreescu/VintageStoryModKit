_min_copier_version: "9.0.0"
_subdirectory: templates
_envops:
  trim_blocks: true
  lstrip_blocks: true
_exclude:
  - _partials
  - |
    {% if tooling_only %}
    **
    !/.config/
    !/.config/**
    !/.editorconfig
    !/.gitattributes
    !/.gitignore
    !/.pre-commit-config.yaml
    !/.prettierignore
    !/.prettierrc.json
    !/.stylua.toml
    !/.vscode/
    !/.vscode/**
    !/{{ _copier_conf.answers_file }}
    {% endif %}
_skip_if_exists:
  - .xmake/vsmk/deploy.json

tooling_only:
  type: bool
  help: Configure tooling for an existing project
  default: false

project_name:
  type: str
  help: Project name and C# root namespace
  default: MyMod
  when: "{{ not tooling_only }}"
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9]*$')) %} Use
    letters and digits, starting with a letter. {% endif %}

mod_id:
  type: str
  help: Vintage Story mod ID
  default: "{{ project_name | lower }}"
  when: "{{ not tooling_only }}"
  validator: >-
    {% if not (mod_id | regex_search('^[a-z][a-z0-9]*$')) %} Use lowercase
    letters and digits, starting with a letter. {% endif %}

side:
  type: str
  help: Game side
  choices:
    Universal: Universal
    Client: Client
    Server: Server
  default: Universal
  when: "{{ not tooling_only }}"

settings:
  type: bool
  help: Include JSON settings and generated configuration menus
  default: true
  when: "{{ not tooling_only }}"

description:
  type: str
  help: Short project description
  default: ""
  when: "{{ not tooling_only }}"

author:
  type: str
  help: Author
  default: ""
  when: "{{ not tooling_only }}"

pre_commit:
  type: bool
  help: Include pre-commit formatting hooks
  default: true

deploy:
  type: str
  help: Initial deployment directories separated by ; (leave blank to disable)
  default: ""
  when: "{{ not tooling_only }}"

vsmk_repository:
  type: str
  default: https://github.com/gabriel-andreescu/VintageStoryModKit
  when: false

vsmk_docs:
  type: str
  default: "{{ vsmk_repository }}/blob/main/docs"
  when: false

vsmk_version:
  type: str
  default: 0.2.0
  when: false

game_version:
  type: str
  default: 1.22.7
  when: false
