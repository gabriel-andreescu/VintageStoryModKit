exclude: ^(scratch/|build/|dist/|\.venv/|\.xmake/)|(^|/)(bin|obj|TestResults)/

repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        language: node
        entry: prettier --write
        additional_dependencies: [prettier@3.9.7]
        types: [text]
        files: \.(md|ya?ml|jsonc?)$
      - id: ruff-check
        name: Ruff check
        language: system
        entry: uv run --locked ruff check --fix
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        language: system
        entry: uv run --locked ruff format
        types_or: [python, pyi]
      - id: csharpier
        name: CSharpier
        language: system
        entry: dotnet csharpier format
        types: [text]
        files: \.(cs|csx|csproj|props|targets|slnx|xml|config)$
      - id: stylua
        name: StyLua
        language: node
        entry: stylua
        additional_dependencies: ["@johnnymorganz/stylua-bin@2.5.2"]
        types: [lua]
        args: [--verify]
