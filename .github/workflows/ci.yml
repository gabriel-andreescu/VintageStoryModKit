name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAKE_COMMIT: 9c1ecaf411d668305e360a5563502f6dbc8f38d7

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows
        run: |
          curl --fail --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - uses: astral-sh/setup-uv@45c121f982720f3bdf236c2ac06f126ca211949c
        with:
          version: "0.12.13"
          python-version: "3.11"
          enable-cache: true
          # The checks job saves the same cache key.
          save-cache: false

      - run: uv sync --locked
      - name: Check generated workflow
        run: |
          uv run copier copy --defaults --trust --vcs-ref HEAD . "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/consumer/.github/workflows/build.yml"
      - name: Test workflow scripts
        run:
          uv run pytest tests/integration/workflows
          --junitxml=build/workflow-results.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: workflow-test-results
          path: build/workflow-results.xml

      - name: Check release tag type
        if: github.ref_type == 'tag'
        run: |
          type=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
          if [ "$type" != commit ]; then
            echo "::error::$GITHUB_REF_NAME points to a '$type' object, not a commit. Workflows calling build.yml by an annotated tag cannot find its nested release workflow. Replace it with a lightweight tag on the same commit."
            exit 1
          fi

  checks:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@45c121f982720f3bdf236c2ac06f126ca211949c
        with:
          version: "0.12.13"
          python-version: "3.11"
          enable-cache: true

      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: gabriel-andreescu/xmake#sha@${{ env.XMAKE_COMMIT }}
          actions-cache-folder: .xmake-install

      - run: uv sync --locked
      - run: dotnet tool restore

      - name: Read game version
        id: game
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = uv run python -c 'import yaml; print(yaml.safe_load(open("copier.yml"))["game_version"]["default"])'
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/setup-game
        with:
          version: ${{ steps.game.outputs.version }}

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key:
            pre-commit-${{ runner.os }}-py311-${{
            hashFiles('.pre-commit-config.yaml',
            'templates/*pre-commit-config.yaml*') }}

      - name: Lint and format
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Read version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = dotnet msbuild dotnet/VintageStoryModKit.Settings/VintageStoryModKit.Settings.csproj --getProperty:PackageVersion --nologo
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne "v$version") {
              throw "Tag '$env:RELEASE_TAG' does not match package version '$version'."
          }
          $templateVersion = uv run python -c 'import yaml; print(yaml.safe_load(open("copier.yml"))["vsmk_version"]["default"])'
          if ($templateVersion -cne $version) {
              throw "copier.yml vsmk_version '$templateVersion' does not match VSMK version '$version'."
          }
          if (-not (Select-String -Path addons/v/vsmk/xmake.lua -SimpleMatch "add_versions(`"$version`", `"v$version`")")) {
              throw "addons/v/vsmk/xmake.lua does not list $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VSMK_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'vsmk-tests'
          dotnet build --configuration Release
          dotnet run --project dotnet/VintageStoryModKit.Tests --configuration Release --no-build --no-restore -- -result-junit (Join-Path $PWD build/dotnet-results.xml)
          pwsh -NoProfile -File tests/integration/Test-Template.ps1
          dotnet pack --configuration Release --no-build --output build/nuget

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: build/dotnet-results.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: nuget-package
          path: build/nuget/*.nupkg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [workflows, checks]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      expected-version: ${{ needs.checks.outputs.version }}

  nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: packages

      - name: Request NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet nuget push packages/*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
